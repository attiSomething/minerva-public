name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Actions > Build > Run workflow builds all three apps; filling in a
  # version (e.g. 0.8.0) also publishes them as release v0.8.0
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish as a release (leave blank to only build)"
        required: false
        default: ""

# Read-only by default; only the release job, which runs on version tags,
# can write
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Flask keyring anthropic pypdfium2 Pillow python-docx reportlab pytest
      - run: python -m pytest -q

  # The app builds run on main, on version tags, and by hand (Actions >
  # Build > Run workflow); pull requests run only the tests above. Each build
  # is kept a few days for downloading; versions worth keeping are releases.
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Minerva.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Minerva.exe self-test failed with exit code $($p.ExitCode)" }
          "Self-test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: Minerva-windows
          path: dist/Minerva.exe
          retention-days: 3

  mac:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Smoke-test the built app
        run: dist/Minerva.app/Contents/MacOS/Minerva --selftest
      # ditto keeps the app's symlinks and permissions, which a plain zip loses
      - run: ditto -c -k --keepParent dist/Minerva.app Minerva-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Minerva-mac
          path: Minerva-mac.zip
          retention-days: 3

  linux:
    if: github.event_name != 'pull_request'
    # the oldest supported runner, so the app runs on older Linux systems too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # what Qt's web view needs to load, here and on users' computers
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Smoke-test the built app
        run: QT_QPA_PLATFORM=offscreen dist/Minerva --selftest
      # a tarball keeps the "can run" permission, which a zip loses
      - run: tar -czf Minerva-linux.tar.gz -C dist Minerva
      - uses: actions/upload-artifact@v4
        with:
          name: Minerva-linux
          path: Minerva-linux.tar.gz
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release) }}
    steps:
      - uses: actions/checkout@v4
      # the app compares the release's version with its own to offer updates,
      # so the two must agree
      - name: Check the version matches the app
        run: |
          app=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('minerva/__init__.py').read()).group(1))")
          if [ "v$app" != "$TAG" ]; then echo "Release $TAG doesn't match the app's version $app (minerva/__init__.py)"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # the Windows file keeps its name: the app's update check looks for it
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}"
          out/Minerva.exe out/Minerva-mac.zip out/Minerva-linux.tar.gz
          --title "Minerva $TAG" --generate-notes
